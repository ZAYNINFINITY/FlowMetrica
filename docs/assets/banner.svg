<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-labelledby="title desc">
  <title id="title">FlowMetrica repository banner</title>
  <desc id="desc">Offline-first network analysis lab built with React, Node.js, Express, Tailwind, Motion and verified MATLAB fixtures. A small matrix and RREF result are shown on the right.</desc>

  <rect width="1600" height="400" fill="#0a111d"/>
  <rect x="0" y="0" width="6" height="400" fill="#22d3ee"/>

  <!-- Matrix-grid texture belongs to the product's own world: algebra. -->
  <g stroke="#16243a" stroke-width="1" opacity="0.7">
    <path d="M872 0V400M904 0V400M936 0V400M968 0V400M1000 0V400M1032 0V400M1064 0V400M1096 0V400M1128 0V400M1160 0V400M1192 0V400M1224 0V400M1256 0V400M1288 0V400M1320 0V400M1352 0V400M1384 0V400M1416 0V400M1448 0V400M1480 0V400M1512 0V400M1544 0V400M1576 0V400"/>
    <path d="M860 32H1600M860 64H1600M860 96H1600M860 128H1600M860 160H1600M860 192H1600M860 224H1600M860 256H1600M860 288H1600M860 320H1600M860 352H1600M860 384H1600"/>
  </g>

  <g font-family="'Space Grotesk', Inter, system-ui, sans-serif">
    <text x="56" y="78" fill="#22d3ee" font-size="14" font-weight="600" letter-spacing="3">OPEN SOURCE  ·  OFFLINE-FIRST NETWORK LAB</text>
    <text x="56" y="166" fill="#e8f1fa" font-size="68" font-weight="600" letter-spacing="-2">FlowMetrica</text>
    <text x="56" y="210" fill="#c8d6e6" font-size="23">Network intelligence &amp; mathematical analysis</text>
  </g>
  <text x="56" y="252" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" fill="#9fb0c4">Scenario → A·x = b → RREF → Answer + Source</text>

  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
    <g fill="#101c2b" stroke="#243247" stroke-width="1">
      <rect x="56" y="286" width="92" height="34" rx="8"/>
      <rect x="158" y="286" width="92" height="34" rx="8"/>
      <rect x="260" y="286" width="104" height="34" rx="8"/>
      <rect x="374" y="286" width="104" height="34" rx="8"/>
      <rect x="488" y="286" width="86" height="34" rx="8"/>
      <rect x="584" y="286" width="158" height="34" rx="8"/>
    </g>
    <g fill="#9fb0c4" text-anchor="middle">
      <text x="102" y="308">React</text>
      <text x="204" y="308">Node.js</text>
      <text x="312" y="308">Express</text>
      <text x="426" y="308">Tailwind</text>
      <text x="531" y="308">Motion</text>
      <text x="663" y="308">MATLAB fixtures</text>
    </g>
    <g fill="#6b7f96" font-size="12" letter-spacing="1">
      <text x="56" y="356">13 SCENARIOS</text>
      <text x="190" y="356">38 TESTS</text>
      <text x="298" y="356">ONE API</text>
      <text x="406" y="356">NO LOGIN</text>
    </g>
    <g fill="#22d3ee">
      <circle cx="170" cy="352" r="2"/><circle cx="278" cy="352" r="2"/><circle cx="386" cy="352" r="2"/>
    </g>
  </g>

  <!-- Mini product window: real math artefacts, not a decorative mock-up. -->
  <g>
    <rect x="900" y="54" width="620" height="292" rx="12" fill="#101c2b" stroke="#243247" stroke-width="1"/>
    <path d="M900 92H1520" stroke="#243247" stroke-width="1"/>
    <g fill="#243247">
      <circle cx="924" cy="73" r="4"/><circle cx="940" cy="73" r="4"/><circle cx="956" cy="73" r="4"/>
    </g>
    <text x="980" y="78" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#22d3ee">POST /api/execute</text>

    <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#c8d6e6">
      <text x="928" y="132">A = [ 1   1   1 ]</text>
      <text x="928" y="158">    [ 1  -1   0 ]</text>
      <text x="928" y="184">    [ 0   1  -1 ]</text>
      <text x="928" y="222">b = [ 110, 60, 10 ]</text>
    </g>
    <text x="928" y="272" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#6b7f96">INC-318 · saved fixture</text>

    <path d="M1206 108V324" stroke="#243247" stroke-width="1"/>
    <g font-family="'JetBrains Mono', ui-monospace, monospace">
      <text x="1236" y="132" font-size="12" fill="#22d3ee" letter-spacing="2">RREF → SOLUTION</text>
      <text x="1236" y="174" font-size="18" fill="#e8f1fa">x = [80, 20, 10]</text>
      <text x="1236" y="204" font-size="13" fill="#9fb0c4">rank 3/3 · unique</text>
      <text x="1236" y="232" font-size="13" fill="#9fb0c4">3 pivots · consistent</text>
    </g>
    <g stroke="#22d3ee" stroke-width="1.5" fill="none" opacity="0.8">
      <path d="M1250 300L1300 272M1300 272L1350 300M1300 272L1300 320"/>
    </g>
    <g fill="#0a111d" stroke="#22d3ee" stroke-width="1.5">
      <circle cx="1250" cy="300" r="7"/><circle cx="1300" cy="272" r="7"/><circle cx="1350" cy="300" r="7"/><circle cx="1300" cy="320" r="7"/>
    </g>
  </g>
</svg>

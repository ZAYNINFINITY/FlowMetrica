<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">FlowMetrica banner</title>
  <desc id="desc">Offline-first network analysis lab. Scenario becomes A x equals b, reduces to RREF, and returns an answer with an honest source label.</desc>

  <rect width="1200" height="300" fill="#0a111d"/>
  <g stroke="#1b2a3d" stroke-width="1">
    <path d="M0 74H1200M0 226H1200"/>
    <path d="M470 0V300" stroke-dasharray="4 6"/>
  </g>
  <rect x="0" y="0" width="5" height="300" fill="#22d3ee"/>

  <g font-family="'Space Grotesk', Inter, system-ui, sans-serif">
    <text x="42" y="58" fill="#22d3ee" font-size="13" font-weight="600" letter-spacing="3">OFFLINE-FIRST NETWORK LAB</text>
    <text x="42" y="132" fill="#e8f1fa" font-size="54" font-weight="600" letter-spacing="-2">FlowMetrica</text>
    <text x="42" y="176" fill="#9fb0c4" font-size="17">Network questions become linear systems.</text>
    <text x="42" y="202" fill="#9fb0c4" font-size="17">The answer always says where it came from.</text>
  </g>
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#6b7f96">
    <text x="42" y="262">13 predefined scenarios</text>
    <text x="42" y="282">one execution interface · no account required</text>
  </g>

  <g font-family="'JetBrains Mono', ui-monospace, monospace">
    <g fill="#101c2b" stroke="#243247" stroke-width="1">
      <rect x="500" y="88" width="140" height="84" rx="10"/>
      <rect x="670" y="88" width="140" height="84" rx="10"/>
      <rect x="840" y="88" width="140" height="84" rx="10"/>
      <rect x="1010" y="88" width="140" height="84" rx="10"/>
    </g>
    <g fill="#22d3ee" font-size="13" font-weight="600">
      <text x="516" y="118">01  SCENARIO</text>
      <text x="686" y="118">02  MODEL</text>
      <text x="856" y="118">03  RREF</text>
      <text x="1026" y="118">04  ANSWER</text>
    </g>
    <g fill="#9fb0c4" font-size="12">
      <text x="516" y="146">fixed JSON</text>
      <text x="686" y="146">A · x = b</text>
      <text x="856" y="146">rank + pivots</text>
      <text x="1026" y="146">+ source</text>
    </g>
    <g stroke="#22d3ee" stroke-width="1.5" fill="none" opacity="0.7">
      <path d="M644 130h20m-6-5 6 5-6 5"/>
      <path d="M814 130h20m-6-5 6 5-6 5"/>
      <path d="M984 130h20m-6-5 6 5-6 5"/>
    </g>
    <text x="500" y="206" fill="#6b7f96" font-size="11">POST /api/execute · the only math entry point</text>
  </g>
</svg>
